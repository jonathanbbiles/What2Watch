# privacy-hosts.conf — one-time decisions for hosts scripts/scan-network-behavior.sh
# cannot classify on its own. Read by the scanner; drives the published privacy page.
#
#   <host>  request | link | ignore
#     request  the app calls it by itself — the host learns the device's IP with no
#              user action, so it MUST be named on the privacy page
#     link     nothing happens until the user taps; it then opens in the browser
#     ignore   not a real request at all (an XML namespace, a code sample)
#
# Getting these wrong in either direction is a Guideline 5.1.1(i) misrepresentation, so
# they are written down here rather than guessed at ship time.

# "Where to watch" builds a JustWatch search URL (whereToWatchURL() in www/index.html)
# and opens it only from watchNow(), i.e. when the user taps the button. Moodie never
# requests anything from JustWatch itself.
www.justwatch.com           link
