# privacy-hosts.conf — one-time decisions about hosts the scanner cannot classify itself.
#
# Read by scripts/scan-network-behavior.sh. Two classifications, and the difference is the
# whole point of the file:
#
#   request  the app contacts this host BY ITSELF. The host learns the device's IP address
#            and what was asked for, whether or not the user did anything. This goes on the
#            privacy page as a third party that receives something.
#
#   link     the app only ever hands this URL to the browser when the user TAPS something.
#            Nothing is sent until then, and it is the browser that connects, not the app.
#            Naming it as a recipient of data would be a false statement in the other
#            direction — the privacy page has to be wrong in neither.
#
# Decided 2026-08-15 by reading www/index.html, not by inference:

# TMDB is a genuine automatic request. www/index.html:463 tmdbRawFetch() does
#   fetch('https://api.themoviedb.org/3' + path + ...)
# for search, title metadata, artwork paths and /watch/providers. It runs while you browse,
# without you tapping anything, so TMDB receives the request and the device's IP.
api.themoviedb.org  request

# JustWatch is NOT contacted by the app. It appears exactly once, at www/index.html:664:
#   function whereToWatchURL(t){ return 'https://www.justwatch.com/us/search?q=' + ... }
# and that string is only ever passed to openURL() from watchNow() — i.e. handed to the
# browser when the user taps "watch now". It is also just the FALLBACK, used when TMDB's own
# /watch/providers deep link is unavailable.
#
# It is never fetch()ed and never an image source (grep confirms a single occurrence). So the
# app sends JustWatch nothing; the user's browser goes there if and when they choose to. It
# is disclosed on the privacy page as an outbound link, which is what it is.
www.justwatch.com  link
