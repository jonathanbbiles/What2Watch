# Moodie — Codemagic cloud build → TestFlight (Capacitor iOS)
# Mirrors the working SlowBurn / ChordLoop pipeline. Automatic code signing via the
# App Store Connect API key integration "ChordLoopAPIKey" (same Apple team, so the
# same key creates/reuses the distribution certificate + provisioning profile).
workflows:
  ios-testflight:
    name: Moodie -> TestFlight
    instance_type: mac_mini_m2
    # 120, not 60: when this workflow submits for review, `fastlane deliver` has to sit and
    # wait for App Store Connect to finish processing the build it just uploaded before it
    # can attach it to the version. That wait is Apple's, and it is routinely 15-45 minutes.
    max_build_duration: 120
    # --- Auto-build on push to main -----------------------------------------
    # A push to main starts this workflow automatically: no browser, no "Start
    # build" click. See PLAYBOOK.md "Shipping without the browser".
    # ONE-TIME per app in the Codemagic UI: the repo needs a webhook registered
    # (app -> Settings -> Webhooks -> "Add webhook"). Apps configured via
    # codemagic.yaml, or connected over SSH/HTTPS rather than the GitHub App, do
    # NOT get one automatically -- without it this block is inert and nothing
    # breaks, builds just never self-start.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # A newer push supersedes an in-flight build of the same branch.
      cancel_previous_builds: true
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      # Imports the Codemagic variable group `tmdb`, which holds the SECURE TMDB_API_KEY.
      # Without this import the variable is simply not present in the build environment —
      # the "Inject the TMDB API key" step below would then abort the build rather than
      # ship an app that quietly has no posters.
      groups:
        - tmdb
      ios_signing:
        provisioning_profiles:
          - Moodie_AppStore_SharedDist
        certificates:
          - JB_Shared_Distribution
      vars:
        BUNDLE_ID: "com.jonathanbiles.moodie"
        # What fastlane/deliver targets. Same value as BUNDLE_ID; named separately because
        # the shared Fastfile reads APP_IDENTIFIER, and that name is what makes the Fastfile
        # identical across every app in the portfolio.
        APP_IDENTIFIER: "com.jonathanbiles.moodie"
        # Apple's numeric App ID. An identifier, not a secret.
        ASC_APP_ID: "6788245223"
        # --- The three compliance answers Apple asks at submission time -----------------
        # These are declarations, not defaults. They must match the shipped build.
        #   encryption: false — Info.plist sets ITSAppUsesNonExemptEncryption false; Moodie
        #     uses nothing beyond exempt HTTPS.
        #   third-party content: TRUE — the app displays poster artwork and synopsis text
        #     fetched from TMDB at runtime, which is exactly "contains, shows, or accesses
        #     third-party content". Moodie has the right to display it (TMDB API terms, with
        #     the required credit shown in-app), so the honest answer is yes. Answering false
        #     while the reviewer notes explain the TMDB licence would be a misrepresentation.
        #   IDFA: false — no ads, no analytics, no attribution SDK.
        ASC_USES_ENCRYPTION: "false"
        ASC_CONTENT_RIGHTS: "true"
        ASC_USES_IDFA: "false"
        # SUBMIT_FOR_REVIEW is intentionally NOT declared here.
        #
        # The post-publish listing step below submits only when SUBMIT_FOR_REVIEW=true, and
        # that can now only arrive as a per-build override from the Codemagic REST API:
        #     scripts/cm-build.sh --submit --watch
        # Previously this was a yaml value that had to be flipped back to "false" after
        # a release; forgetting meant the next push to main submitted itself. Undeclared
        # means the safe state is the default, not something to remember.
        #
        # ASC_LISTING_MODE is likewise undeclared. Undeclared = "validate" = read-only, so
        # every push to main proves the App Store Connect key still authenticates without
        # ever writing to the live listing. Set it to "push" per build to upload metadata
        # and screenshots without submitting:
        #     scripts/cm-build.sh --env ASC_LISTING_MODE=push --watch
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Inject the TMDB API key (secure var -> placeholder; never in git)
        # www/index.html ships the literal placeholder __TMDB_API_KEY__. What2Watch is a
        # PUBLIC repo, so the key is only ever in Codemagic: add TMDB_API_KEY as a SECURE
        # environment variable on this workflow. This step must run BEFORE `npx cap sync`,
        # because sync is what copies www/ into the iOS app bundle.
        #
        # It fails the build when the variable is missing rather than shipping silently: the
        # app would still run (it degrades to its own gradient art with no network calls),
        # but it would reach TestFlight with no posters while claiming to have them.
        #
        # The key value is never echoed. Python reads it from the environment, so it never
        # appears in the build log, in `ps`, or in a shell history.
        script: |
          set -euo pipefail
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "MISSING: TMDB_API_KEY"
            echo "Add it as a SECURE environment variable on the ios-testflight workflow"
            echo "(Codemagic -> app -> Environment variables). Do not hardcode it in the repo."
            exit 1
          fi
          python3 - <<'PY'
          import os, sys, pathlib
          f = pathlib.Path("www/index.html")
          src = f.read_text(encoding="utf-8")
          if "__TMDB_API_KEY__" not in src:
              sys.exit("www/index.html has no __TMDB_API_KEY__ placeholder — did someone hardcode a key?")
          f.write_text(src.replace("__TMDB_API_KEY__", os.environ["TMDB_API_KEY"]), encoding="utf-8")
          PY
          # Confirm the swap happened without printing the key itself.
          if grep -q '__TMDB_API_KEY__' www/index.html; then
            echo "placeholder still present after substitution"; exit 1
          fi
          echo "TMDB key injected (value not logged)."

      - name: Verify the TMDB poster pipeline against the live API (fails the build if broken)
        # Guards the failure this build exists to fix. In the app every TMDB failure degrades
        # to Moodie's own gradient art, so a bad key, a blocked network and a changed API
        # shape all look identical on a tester's screen. This resolves a real poster for a
        # title that unquestionably has one (Dune) and fails the build if it cannot — so a
        # poster-less IPA can never reach TestFlight again. The key is never printed.
        script: bash scripts/tmdb-live-check.sh

      # The add / patch / sync split is load-bearing and must stay in this order.
      # `cap add` writes the Xcode project and the Podfile from the Capacitor template;
      # `cap sync` copies www/ and runs `pod install`. The deployment target has to be
      # patched BETWEEN them: CocoaPods bakes the Podfile's `platform :ios` into every pod
      # target at install time, so patching after sync would leave the Pods on the old
      # minimum and ship a binary whose pods disagree with the app.
      - name: Add iOS platform (Capacitor)
        script: |
          [ -d ios ] || npx cap add ios
      - name: Force min iOS 15 + Universal device family (BEFORE cap sync)
        script: |
          set -euo pipefail
          PBX=ios/App/App.xcodeproj/project.pbxproj
          PODFILE=ios/App/Podfile

          # perl, not `sed -i ''`: this runs on a macOS (BSD) sed, which does NOT expand \n
          # in a replacement — the "insert a new line" case below would silently write a
          # literal backslash-n into the project file.
          #
          # 1. App target minimum. The Capacitor 6 template ships iOS 13; Apple wants 15+
          #    (ITMS-90068 on upload if the minimum is below what the store accepts).
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBX"

          # 2. Universal, stated explicitly rather than inherited. Moodie ships iPad
          #    screenshots and a real large-screen layout, and Apple reviews on an iPad Air
          #    (M3) either way — so say "1,2" out loud instead of relying on a template
          #    default that a future Capacitor version could change underneath us.
          if grep -q 'TARGETED_DEVICE_FAMILY' "$PBX"; then
            perl -pi -e 's/TARGETED_DEVICE_FAMILY = "?[0-9,]+"?;/TARGETED_DEVICE_FAMILY = "1,2";/g' "$PBX"
          else
            perl -pi -e 's/^(\s*)(IPHONEOS_DEPLOYMENT_TARGET = 15\.0;)/$1$2\n$1TARGETED_DEVICE_FAMILY = "1,2";/g' "$PBX"
          fi

          # 3. Podfile platform. Capacitor's own post_install (assertDeploymentTarget)
          #    propagates this to every pod, so this single line covers the whole Pods project.
          perl -pi -e "s/^platform :ios, *'[0-9.]+'/platform :ios, '15.0'/" "$PODFILE"

          echo "--- deployment target / device family after patch ---"
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET\|TARGETED_DEVICE_FAMILY' "$PBX" | sort -u
          grep -n "platform :ios" "$PODFILE"

          # Fail the build rather than silently shipping the template defaults.
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$PBX" || { echo "FATAL: deployment target patch did not apply"; exit 1; }
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' "$PBX"     || { echo "FATAL: device family patch did not apply"; exit 1; }
          grep -q "platform :ios, '15.0'" "$PODFILE"           || { echo "FATAL: Podfile platform patch did not apply"; exit 1; }
          if grep -qE 'IPHONEOS_DEPLOYMENT_TARGET = (1[0-4]|[0-9])\.' "$PBX"; then
            echo "FATAL: a build configuration is still below iOS 15"; exit 1
          fi
      - name: Sync iOS platform (Capacitor)
        script: |
          npx cap sync ios
      - name: Verify the Capacitor plugins actually reached the generated iOS project
        script: |
          set -euo pipefail
          # Being in package.json/node_modules proves nothing: a plugin that never lands in
          # the GENERATED project is simply absent at runtime, and `cap ls` will still list
          # it happily. So check the generated artifacts — but check the ones that actually
          # exist.
          #
          # A previous version of this step tested `[ -d ios/App/Pods/<Name> ]` and failed
          # every single build. Capacitor declares its plugins as PATH pods:
          #     pod 'CapacitorBrowser', :path => '../../node_modules/@capacitor/browser'
          # CocoaPods does not copy a path pod into Pods/<Name>/ — it references it where it
          # lies and records it in Podfile.lock and Pods/Local Podspecs/. That directory was
          # never going to exist, so the guard was testing a condition that is false even when
          # everything is perfectly healthy. The real signals are the Podfile declaration and
          # the Podfile.lock entry.
          PODFILE=ios/App/Podfile
          LOCK=ios/App/Podfile.lock

          echo "--- generated Podfile ---"; cat "$PODFILE"
          echo "--- Podfile.lock present? ---"; [ -f "$LOCK" ] && echo "yes" || echo "no"
          echo "--- Pods/Local Podspecs ---"; ls -1 ios/App/Pods/"Local Podspecs" 2>/dev/null || echo "(none)"

          missing=0
          for p in CapacitorBrowser CapacitorHaptics CapacitorShare CapacitorPreferences; do
            if ! grep -q "pod '$p'" "$PODFILE"; then
              echo "MISSING from Podfile: $p — the plugin never reached the generated project"
              missing=1
              continue
            fi
            # Podfile.lock only exists once `pod install` has run. When it does exist it is
            # authoritative, so a plugin absent from it really was dropped. When it does not,
            # say so loudly but do not fail — that is a pipeline-ordering question, not a
            # broken app, and this guard must never be the reason a good build dies again.
            if [ -f "$LOCK" ]; then
              if grep -q "$p" "$LOCK"; then
                echo "present: $p (Podfile + Podfile.lock)"
              else
                echo "MISSING from Podfile.lock: $p — declared but not installed"
                missing=1
              fi
            else
              echo "present: $p (Podfile; no Podfile.lock yet to confirm installation)"
            fi
          done

          # Capacitor 6 uses CocoaPods here, so there should be no SPM package manifest at all.
          # If a future Capacitor switches this project to SPM, plugins are dropped silently
          # unless they declare Package.swift — stop and make someone look.
          if [ -f ios/App/CapApp-SPM/Package.swift ]; then
            echo "NOTE: this project is now SPM-based, not CocoaPods — plugin inclusion must be re-verified:"
            cat ios/App/CapApp-SPM/Package.swift
            missing=1
          fi
          [ "$missing" -eq 0 ] || { echo "FATAL: Capacitor plugin verification failed"; exit 1; }
      - name: Add the app-level privacy manifest
        script: |
          set -euo pipefail
          # Accurate to what this build actually does: Moodie makes no network requests,
          # collects nothing, tracks nothing, and uses no required-reason API from the app
          # target itself (UserDefaults access lives in the Preferences pod, which ships its
          # own manifest). An empty-but-explicit manifest is the honest declaration.
          MANIFEST=ios/App/App/PrivacyInfo.xcprivacy
          cat > "$MANIFEST" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>NSPrivacyTracking</key>
            <false/>
            <key>NSPrivacyTrackingDomains</key>
            <array/>
            <key>NSPrivacyCollectedDataTypes</key>
            <array/>
            <key>NSPrivacyAccessedAPITypes</key>
            <array/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$MANIFEST"

          # Register it with the App target so it lands at the bundle ROOT, where Apple reads
          # it. (Dropping the file in www/ would only bundle it under public/, where it is
          # inert.) This needs the xcodeproj gem, which comes with CocoaPods/fastlane on this
          # image — but the exact ruby on PATH varies between Codemagic images, so try to
          # install it rather than assuming.
          #
          # NON-FATAL on purpose. Apple requires a privacy manifest from third-party SDKs and
          # for required-reason API use; the App target itself calls no required-reason API
          # (the UserDefaults access lives in the Preferences pod, which ships its own
          # manifest). So this file is a belt-and-braces accurate declaration, not a
          # submission blocker — it must never be the reason a good build fails.
          if ! ruby -e 'require "xcodeproj"' 2>/dev/null; then
            echo "xcodeproj gem not loadable — trying to install it"
            gem install xcodeproj --no-document || true
          fi
          if ruby -e 'require "xcodeproj"' 2>/dev/null; then
            ruby -e '
              require "xcodeproj"
              proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
              target = proj.targets.find { |t| t.name == "App" } or abort("no App target")
              group = proj.main_group.find_subpath("App", true)
              if group.files.any? { |f| f.path == "PrivacyInfo.xcprivacy" }
                puts "PrivacyInfo.xcprivacy already registered"
              else
                ref = group.new_file("PrivacyInfo.xcprivacy")
                target.add_resources([ref])
                proj.save
                puts "added PrivacyInfo.xcprivacy to the App target resources"
              end
            ' || echo "WARNING: xcodeproj could not register the manifest — continuing."
          else
            echo "WARNING: could not load xcodeproj — privacy manifest written to disk but NOT registered with the App target."
          fi

          # Report the truth either way, so the build log says what actually shipped.
          if grep -q 'PrivacyInfo.xcprivacy' ios/App/App.xcodeproj/project.pbxproj; then
            echo "RESULT: privacy manifest IS registered with the App target."
          else
            echo "RESULT: privacy manifest is NOT registered (app target uses no required-reason API, so this is not a submission blocker)."
          fi
      - name: Embed the real app icon (replace Capacitor default)
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f appicon-1024.png ]; then
            rm -rf "$ICONSET"; mkdir -p "$ICONSET"
            cp appicon-1024.png "$ICONSET/AppIcon-1024.png"
            cat > "$ICONSET/Contents.json" <<'JSON'
          { "images": [ { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }
          JSON
            echo "Embedded Moodie app icon:"; ls -la "$ICONSET"
          else
            echo "No appicon-1024.png found — using Capacitor default icon."
          fi
      - name: Set marketing version + build number + export-compliance flag
        script: |
          PLIST=ios/App/App/Info.plist
          # Marketing version (CFBundleShortVersionString) is set deliberately here rather than
          # left at the Capacitor template default. It MUST match the version string that is
          # currently editable in App Store Connect — which is literally "1.0", not "1.0.0".
          # deliver attaches the build to that editable version; a build stamped 1.0.0 can never
          # attach to ASC version 1.0, and the submit step would just wait until it times out.
          MARKETING_VERSION="1.0"
          # Build number is a UTC timestamp: always increases, never collides, and needs no
          # network round-trip to App Store Connect to work out "the last one plus one".
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "CFBundleShortVersionString = $MARKETING_VERSION"
          echo "CFBundleVersion            = $BUILD_NUMBER"
      - name: Set up code signing — apply the stored profile + the ONE shared cert (no mint, no revoke)
        script: |
          security find-identity -v -p codesigning || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

        # submit_to_app_store is deliberately NOT used. It submits whatever listing is
        # already in App Store Connect and fails if anything is missing; it cannot supply
        # the screenshots, description or review notes itself. The post-publish step below
        # uses `fastlane deliver`, which uploads the listing AND submits, from files in
        # this repo. Turning both on would submit the same version twice.
        # submit_to_app_store: true

      # --- Post-publish: store listing + submit for review ----------------------
      # Ordering is the whole point: this runs after the block above has uploaded the signed
      # IPA to App Store Connect, so the build exists for deliver to attach to the version.
      scripts:
        - name: App Store listing (validate by default; submits only when SUBMIT_FOR_REVIEW=true)
          # One step, three behaviours, chosen by environment (see scripts/asc-listing.sh):
          #   nothing set          -> validate: read-only. Proves the ASC key still works on
          #                           every single build, and writes nothing. This is why a
          #                           push to main can never disturb an app that is in review.
          #   ASC_LISTING_MODE=push -> upload metadata + screenshots, do not submit.
          #   SUBMIT_FOR_REVIEW=true -> upload the listing and submit for review.
          #
          # ASC_LISTING_ADVISORY=true applies to the validate mode only: the IPA has already
          # shipped to TestFlight by the time this runs, so a read-only check must not repaint
          # a successful build as failed. Writes are never advisory.
          script: ASC_LISTING_ADVISORY=true bash scripts/asc-listing.sh

  # ---------------------------------------------------------------------------
  # READ-ONLY validation of the whole no-browser submit path, startable WITHOUT a
  # Codemagic API token: push a branch whose name starts with `asc-validate` and this
  # workflow runs. Nothing else does — `ios-testflight` only triggers on main — so the
  # push builds nothing, signs nothing, uploads nothing and submits nothing.
  #
  #     git switch -c asc-validate-<what-you-changed> && git push -u origin HEAD
  #
  # WHY A BRANCH TRIGGER, AND NOT THE API
  # Every other check in this repo (asc-auth-check, asc-screenshots) has no `triggering:`
  # block, so it can only be started through the Codemagic REST API — which needs
  # CODEMAGIC_API_TOKEN, which is not configured on this machine. Those checks were
  # therefore unrunnable, and the submit path had never actually been proven to
  # authenticate. A branch trigger needs no token at all.
  #
  # HOW TO READ THE RESULT WITHOUT A TOKEN
  # Codemagic posts a GitHub check run naming every step and its outcome, which
  # `gh api repos/<owner>/<repo>/commits/<sha>/check-runs` returns. The steps below are
  # split so that WHICH step went red is itself the diagnosis — the check run carries step
  # names and pass/fail, not log text.
  # ---------------------------------------------------------------------------
  asc-listing-validate:
    name: Moodie — ASC listing validate (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'asc-validate*'
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      vars:
        BUNDLE_ID: "com.jonathanbiles.moodie"
        APP_IDENTIFIER: "com.jonathanbiles.moodie"
        ASC_APP_ID: "6788245223"
        ASC_USES_ENCRYPTION: "false"
        ASC_CONTENT_RIGHTS: "true"
        ASC_USES_IDFA: "false"
        # Belt and braces. This workflow has no publishing block and no build, so it could
        # not submit even if something set these; declaring the safe values means a stray
        # per-build override cannot turn a validation run into a submission.
        ASC_LISTING_MODE: "validate"
        SUBMIT_FOR_REVIEW: "false"
      xcode: latest
    scripts:
      # The first two steps exist because the GitHub check run reports step NAMES and
      # outcomes but not log text, so the only way to read a failure without a Codemagic
      # API token is to make each step able to fail for exactly one reason. They also
      # catch the two things that actually break when this lane is copied to a new app:
      # fastlane missing from the image, and a Fastfile that does not parse.
      - name: 0/7 Toolchain — fastlane on PATH, Ruby, listing files present
        script: |
          set -uo pipefail
          echo "ruby:     $(ruby -v 2>&1 || echo MISSING)"
          echo "fastlane: $(command -v fastlane 2>/dev/null || echo 'NOT ON PATH')"
          if ! command -v fastlane >/dev/null 2>&1; then
            echo "FATAL: fastlane is not installed on this image."
            echo "Codemagic macOS images normally ship it; if this is red, the lane needs"
            echo "a Gemfile + 'bundle install', or the workflow needs a different image."
            exit 1
          fi
          export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          export FASTLANE_SKIP_UPDATE_CHECK=1 FASTLANE_DISABLE_COLORS=1
          fastlane --version || exit 1
          echo "--- fastlane/ ---"; ls -la fastlane
          echo "--- metadata ---";  ls -R fastlane/metadata | head -40
          echo "--- screenshots ---"; ls fastlane/screenshots/en-US | head -40
      - name: 1/7 Fastfile parses — list the lanes it defines
        # `fastlane lanes` loads and evaluates the Fastfile without running anything. A
        # Ruby error in the shared lane shows up here rather than being mistaken for a
        # listing problem or an auth problem.
        script: |
          export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          export FASTLANE_SKIP_UPDATE_CHECK=1 FASTLANE_DISABLE_COLORS=1
          fastlane lanes
      - name: 2/7 Listing lint — fastlane/metadata + screenshots vs Apple's limits (no network)
        # Plain Ruby, deliberately not a fastlane lane: it runs identically on a laptop, so
        # it is testable before it ever reaches CI, and it is immune to fastlane's working
        # directory. Green here with red below means the listing is fine and the key is the
        # problem; red here means a field is over length or a screenshot is the wrong size,
        # and no amount of working credentials would have saved the submission.
        script: |
          export LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          ruby scripts/lint_listing.rb
      - name: 3/7 ASC credentials exported into the build (names only, never values)
        # Split out from the auth check because the two failures have completely different
        # fixes, and the check run cannot show log text — only which step went red.
        #
        #   RED HERE  -> `integrations: app_store_connect:` wires the key into Codemagic's
        #                OWN publishing step but does not export it to scripts. Fix: add the
        #                SAME key from Team Integrations as three SECURE environment
        #                variables on this app in the Codemagic UI. Only Jonathan can do
        #                that — they are secret.
        #   RED BELOW -> the variables arrived but Apple rejected the key, or the .p8 will
        #                not parse. Fix: the key id / issuer id / key role.
        script: |
          set -uo pipefail
          missing=0
          for v in APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!v:-}" ]; then echo "MISSING: $v"; missing=1; else echo "present: $v"; fi
          done
          # Names only. Never print a value — build logs are not private.
          echo "--- ASC-shaped variable NAMES visible in this build ---"
          env | sed 's/=.*//' | grep -E 'APP_STORE|ASC_|APPLE|CERTIFICATE' | sort || true
          if [ "$missing" -ne 0 ]; then
            echo "Add the key as three SECURE env vars on this app in Codemagic. Never hardcode it."
            exit 1
          fi
      - name: 4/7 Apple accepts the key — authenticated App Store Connect call
        # A real authenticated request through Codemagic's own app-store-connect CLI.
        # RED HERE means the key id, the issuer id, or the key's ROLE is wrong — a key with
        # too narrow a role authenticates for some calls and 403s on the rest.
        script: bash scripts/asc-auth-check.sh --only cli
      - name: 5/7 The private key arrived intact (PEM shape only — no value printed)
        # Structural, not cryptographic: BEGIN/END lines present and real newlines survived
        # the trip through the environment. RED HERE means the variable itself is mangled —
        # most often a .p8 pasted as one long line, which every parser then rejects for a
        # reason that has nothing to do with the key.
        script: |
          set -uo pipefail
          key="${APP_STORE_CONNECT_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then echo "FATAL: APP_STORE_CONNECT_PRIVATE_KEY is empty"; exit 1; fi
          lines="$(printf '%s' "$key" | wc -l | tr -d ' ')"
          echo "newline count: $lines  (a .p8 has ~5)"
          case "$key" in
            *"BEGIN PRIVATE KEY"*)    echo "shape: PKCS#8 (what Apple issues)" ;;
            *"BEGIN EC PRIVATE KEY"*) echo "shape: SEC1 EC" ;;
            *) echo "FATAL: no BEGIN line — this is not PEM text"; exit 1 ;;
          esac
          case "$key" in *"END"*) echo "END line present" ;; *) echo "FATAL: no END line"; exit 1 ;; esac
          if [ "$lines" -lt 2 ]; then
            echo "FATAL: the key is on a single line — the newlines were lost when it was stored."
            echo "Re-add it in Codemagic by pasting the .p8 file contents verbatim, BEGIN/END lines included."
            exit 1
          fi
      - name: 6/7 THE AUTHORITY — the real lane, fastlane deliver auth + version-state guard (writes nothing)
        # The real lane, in its default read-only mode: authenticates the way deliver does,
        # reads the App Store version states, and reports what a submit WOULD target. If the
        # app is in review it prints that the guard would refuse — which is the behaviour
        # being validated, not a failure.
        script: bash scripts/asc-listing.sh
      - name: 7/7 Diagnostic — Ruby OpenSSL parses the .p8 directly
        # Runs AFTER the lane on purpose: this probe approximates what fastlane does, and an
        # approximation must never be allowed to block the real thing. It is here to explain a
        # red step above, not to gate the pipeline.
        # Separate from the CLI step because the CLI (Python) and fastlane (Ruby) parse
        # the key with completely different stacks. This is the exact step that fails on a
        # laptop with OpenSSL "invalid curve name", and it is the reason submits run
        # server-side. RED HERE means the CLI path works but deliver's cannot.
        script: bash scripts/asc-auth-check.sh --only ruby

  # ---------------------------------------------------------------------------
  # On-demand, READ-ONLY check that the App Store Connect key stored in Codemagic
  # can actually drive a submission. Submits nothing, signs nothing, builds nothing.
  # Deliberately has no `triggering:` block, so a push can never run it.
  #     scripts/cm-build.sh -w asc-auth-check --watch
  # ---------------------------------------------------------------------------
  asc-auth-check:
    name: Moodie — ASC auth check (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      vars:
        ASC_APP_ID: "6788245223"
      xcode: latest
    scripts:
      - name: Prove the ASC key authenticates for a submission (submits nothing)
        script: bash scripts/asc-auth-check.sh
